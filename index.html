<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo Slide Thuyết Trình AI - Galaxy Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    /* Nền không gian sâu thẫm kết hợp dải ngân hà tím hồng đen */
    body {
      background: radial-gradient(ellipse at bottom, #1b1035 0%, #090a0f 100%);
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Tạo hiệu ứng dải ngân hà lấp lánh huyền ảo phía sau */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(147, 51, 234, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(79, 70, 229, 0.15) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(15, 11, 28, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      width: 100%;
      max-width: 650px;
      padding: 35px 30px;
      border-radius: 20px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      box-shadow: 0 0 30px rgba(147, 51, 234, 0.2), 0 10px 40px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #c084fc, #f472b6, #e879f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(192, 132, 252, 0.3);
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 25px;
      letter-spacing: 0.5px;
    }

    textarea {
      width: 100%;
      height: 130px;
      padding: 16px;
      background: rgba(10, 6, 20, 0.7);
      color: #f8fafc;
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 12px;
      font-size: 1rem;
      resize: vertical;
      outline: none;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    textarea:focus {
      border-color: #c084fc;
      box-shadow: 0 0 15px rgba(192, 132, 252, 0.4);
    }

    .btn {
      padding: 13px 26px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    /* Nút Gửi phối màu gradient ngân hà */
    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6, #d946ef);
      color: #ffffff;
      width: 100%;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #7c3aed, #c026d3);
      box-shadow: 0 0 20px rgba(217, 70, 239, 0.6);
      transform: translateY(-1px);
    }

    .confirm-group {
      display: none;
      gap: 12px;
      width: 100%;
    }

    .btn-confirm {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      flex: 1;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-confirm:hover {
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
      transform: translateY(-1px);
    }

    .btn-cancel {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      color: #ffffff;
      flex: 1;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
    }

    .btn-cancel:hover {
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.5);
      transform: translateY(-1px);
    }

    .loading-state {
      display: none;
      margin-top: 20px;
      color: #e879f9;
      font-size: 1.05rem;
      text-shadow: 0 0 10px rgba(232, 121, 249, 0.5);
    }

    .questions-container {
      display: none;
      margin-top: 25px;
      text-align: left;
      background: rgba(10, 6, 20, 0.8);
      padding: 22px;
      border-radius: 14px;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .questions-container h3 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: #c084fc;
    }

    .question-card {
      background: rgba(22, 15, 41, 0.9);
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      border: 1px solid rgba(139, 92, 246, 0.25);
    }

    .question-title {
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: #f1f5f9;
    }

    .mode-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-mode {
      padding: 6px 14px;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-mode.active {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #ffffff;
      font-weight: bold;
      border: none;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background: rgba(10, 6, 20, 0.9);
      color: #f8fafc;
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
    }

    select:focus, input[type="text"]:focus {
      border-color: #c084fc;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🌌 Tạo Slide Thuyết Trình AI</h1>
    <p class="subtitle">Biến ý tưởng thô thành bài thuyết trình PPTX chuyên nghiệp trong vài giây</p>

    <!-- Ô nhập ý tưởng -->
    <textarea id="userPrompt" placeholder="Nhập ý tưởng bài thuyết trình của bạn tại đây..."></textarea>

    <!-- Khu vực nút bấm -->
    <div id="actionArea">
      <button id="btnSend" class="btn btn-primary" onclick="clickSend()">Gửi</button>

      <div id="confirmGroup" class="confirm-group">
        <button class="btn btn-confirm" onclick="clickConfirm()">Xác nhận</button>
        <button class="btn btn-cancel" onclick="clickCancel()">Hủy</button>
      </div>
    </div>

    <!-- Trạng thái chờ -->
    <div id="loadingState" class="loading-state">
      ✨ AI đang khám phá ý tưởng và khởi tạo câu hỏi...
    </div>

    <!-- Khung 3 câu hỏi cốt lõi -->
    <div id="questionsContainer" class="questions-container">
      <h3>🎯 Trả lời 3 câu hỏi sau để AI tạo slide chính xác nhất:</h3>
      <div id="questionsList"></div>
      <button class="btn btn-primary" style="margin-top: 10px;" onclick="alert('Đã ghi nhận! Bước tiếp theo sẽ kết nối AI để xuất file PPTX.')">Bắt đầu tạo Slide PPTX</button>
    </div>
  </div>

  <script>
    // Bấm nút Gửi
    function clickSend() {
      const prompt = document.getElementById('userPrompt').value.trim();
      if (!prompt) {
        alert('Vui lòng nhập ý tưởng bài thuyết trình trước khi gửi!');
        return;
      }
      document.getElementById('btnSend').style.display = 'none';
      document.getElementById('confirmGroup').style.display = 'flex';
    }

    // Bấm nút Hủy
    function clickCancel() {
      document.getElementById('confirmGroup').style.display = 'none';
      document.getElementById('btnSend').style.display = 'block';
    }

    // Bấm nút Xác nhận
    function clickConfirm() {
      document.getElementById('confirmGroup').style.display = 'none';
      document.getElementById('loadingState').style.display = 'block';

      setTimeout(() => {
        document.getElementById('loadingState').style.display = 'none';
        renderCoreQuestions();
        document.getElementById('questionsContainer').style.display = 'block';
      }, 1500);
    }

    // Hiển thị 3 câu hỏi cốt lõi
    function renderCoreQuestions() {
      const questions = [
        {
          id: 1,
          title: "1. Khán giả chính lắng nghe bài thuyết trình này là ai?",
          options: ["Học sinh / Sinh viên", "Nhà đầu tư / Ban lãnh đạo", "Khách hàng / Đối tác"]
        },
        {
          id: 2,
          title: "2. Phong cách thiết kế slide bạn mong muốn là gì?",
          options: ["Tối giản & Hiện đại", "Sáng tạo & Tương tác", "Chuyên nghiệp & Nhiều số liệu"]
        },
        {
          id: 3,
          title: "3. Mục tiêu lớn nhất của bài thuyết trình này là gì?",
          options: ["Thuyết phục / Bán hàng", "Truyền cảm hứng / Đào tạo", "Báo cáo tiến độ / Tổng kết"]
        }
      ];

      const listDiv = document.getElementById('questionsList');
      listDiv.innerHTML = '';

      questions.forEach(q => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.innerHTML = `
          <div class="question-title">${q.title}</div>
          <div class="mode-buttons">
            <button id="btn-select-${q.id}" class="btn-mode active" onclick="switchMode(${q.id}, 'select')">Chọn</button>
            <button id="btn-input-${q.id}" class="btn-mode" onclick="switchMode(${q.id}, 'input')">Nhập</button>
          </div>
          <div id="box-select-${q.id}">
            <select>
              ${q.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
            </select>
          </div>
          <div id="box-input-${q.id}" style="display: none;">
            <input type="text" placeholder="Tự nhập câu trả lời của bạn..." />
          </div>
        `;
        listDiv.appendChild(card);
      });
    }

    // Chuyển đổi giữa Chế độ Chọn và Nhập
    function switchMode(qId, mode) {
      const selectBox = document.getElementById(`box-select-${qId}`);
      const inputBox = document.getElementById(`box-input-${qId}`);
      const btnSelect = document.getElementById(`btn-select-${qId}`);
      const btnInput = document.getElementById(`btn-input-${qId}`);

      if (mode === 'select') {
        selectBox.style.display = 'block';
        inputBox.style.display = 'none';
        btnSelect.classList.add('active');
        btnInput.classList.remove('active');
      } else {
        selectBox.style.display = 'none';
        inputBox.style.display = 'block';
        btnInput.classList.add('active');
        btnSelect.classList.remove('active');
      }
    }
  </script>
</body>
</html>
