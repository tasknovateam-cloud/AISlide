<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Tạo Slide Chuyên Nghiệp</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #a855f7;
            --accent-color: #ec4899;
            --bg-dark: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Input Controls */
        .control-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 900px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .input-group {
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        /* Slide Viewport */
        .slide-container {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16 / 9;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Dynamic Animated Background */
        .slide-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #022c22);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            z-index: 1;
        }

        .slide-bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            z-index: 2;
            filter: blur(2px);
            transition: all 1s ease;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Slide Content Layer */
        .slide-content {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100%;
            padding: 40px;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 30px;
            align-items: center;
            color: #ffffff;
        }

        /* Layout Types */
        .slide-content.full-width {
            grid-template-columns: 1fr;
            text-align: center;
        }

        /* Animations */
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        .animate-slide-up {
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-zoom {
            animation: zoomIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Content Elements */
        .slide-text-side {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .slide-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        .slide-subtitle {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.5;
        }

        /* 3 Core Questions Section */
        .questions-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .q-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(8px);
            border-left: 4px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 13px;
            transition: all 0.3s;
        }

        .q-card:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateX(5px);
        }

        .q-title {
            font-weight: 700;
            color: #f472b6;
            margin-bottom: 2px;
        }

        /* Image Frame */
        .slide-image-side {
            width: 100%;
            height: 100%;
            max-height: 380px;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.15);
        }

        .slide-image-side img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .slide-image-side:hover img {
            transform: scale(1.05);
        }

        /* Navigation Bar */
        .nav-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 960px;
            margin-top: 15px;
        }

        .page-indicator {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 600;
        }

        /* Speaker Notes Section */
        .notes-container {
            width: 100%;
            max-width: 960px;
            margin-top: 20px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            padding: 16px 20px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
        }

        .notes-header {
            font-size: 13px;
            font-weight: 700;
            color: #f59e0b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .notes-content {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- Control Panel -->
    <div class="control-panel">
        <div class="input-group">
            <input type="text" id="topicInput" placeholder="Nhập chủ đề slide (VD: Trí tuệ nhân tạo, Vũ trụ, Cà phê...)" value="Trí tuệ nhân tạo AI">
            <button onclick="generateSlides()"><i class="fa-solid fa-wand-magic-sparkles"></i> Tạo Slide Mới</button>
        </div>
    </div>

    <!-- Slide Canvas -->
    <div class="slide-container" id="slideContainer">
        <div class="slide-bg"></div>
        <div class="slide-bg-overlay" id="bgOverlay"></div>
        
        <div class="slide-content animate-slide-up" id="slideContent">
            <!-- Dynamic Content Injected via JS -->
        </div>
    </div>

    <!-- Navigation Controls -->
    <div class="nav-controls">
        <button onclick="prevSlide()"><i class="fa-solid fa-arrow-left"></i> Trước</button>
        <span class="page-indicator" id="pageIndicator">Slide 1 / 3</span>
        <button onclick="nextSlide()">Sau <i class="fa-solid fa-arrow-right"></i></button>
    </div>

    <!-- Speaker Notes Section -->
    <div class="notes-container">
        <div class="notes-header"><i class="fa-solid fa-note-sticky"></i> Ghi chú thuyết trình (Presenter Notes)</div>
        <div class="notes-content" id="speakerNotes">Ghi chú cho diễn giả sẽ hiển thị tại đây...</div>
    </div>

    <script>
        let currentSlide = 0;
        let slideData = [];

        // HÀM TẠO DỮ LIỆU SLIDE TỰ ĐỘNG THEO CHỦ ĐỀ
        function createDataFromTopic(topic) {
            return [
                {
                    title: `Tổng Quan Về ${topic.toUpperCase()}`,
                    subtitle: `Khám phá những khái niệm căn bản và tầm ảnh hưởng cốt lõi của ${topic} trong thời đại hiện đại.`,
                    imageQuery: `${topic},technology`,
                    layout: 'split',
                    questions: [
                        { q: `Thực chất ${topic} là gì?`, a: `Là giải pháp mang tính đột phá giúp tối ưu hóa hiệu suất và mở ra góc nhìn mới.` },
                        { q: `Tại sao ${topic} lại quan trọng lúc này?`, a: `Vì nó giải quyết trực tiếp các thách thức lớn và thúc đẩy sự phát triển mạnh mẽ.` },
                        { q: `Ai là người hưởng lợi chính?`, a: `Tất cả cá nhân và tổ chức biết ứng dụng linh hoạt vào thực tiễn.` }
                    ],
                    notes: `Lời khuyên khi thuyết trình slide này: Bắt đầu bằng việc đặt câu hỏi tương tác với người nghe về ${topic}. Dành 2 phút để làm rõ 3 câu hỏi cốt lõi trên.`
                },
                {
                    title: `Thách Thức & Cơ Hội Của ${topic}`,
                    subtitle: `Phân tích hai mặt của vấn đề để có cái nhìn toàn diện và chiến lược ứng phó phù hợp.`,
                    imageQuery: `${topic},future,data`,
                    layout: 'split',
                    questions: [
                        { q: `Thách thức lớn nhất hiện nay là gì?`, a: `Sự thay đổi nhanh chóng đòi hỏi khả năng thích ứng và học hỏi liên tục.` },
                        { q: `Cơ hội vàng nằm ở đâu?`, a: `Khai thác các khoảng trống thị trường và ứng dụng công nghệ mới.` },
                        { q: `Cần chuẩn bị gì để bứt phá?`, a: `Kỹ năng, tư duy đổi mới và nguồn lực đầu tư đúng hướng.` }
                    ],
                    notes: `Nhấn mạnh vào phần 'Cơ hội'. Sử dụng hình ảnh minh họa bên cạnh để diễn tả sự đối lập giữa thách thức và tiềm năng phát triển.`
                },
                {
                    title: `Tương Lai & Tầm Nhìn Chiến Lược`,
                    subtitle: `Định hướng hành động thực tế và xu hướng phát triển bền vững trong những năm tới.`,
                    imageQuery: `${topic},strategy,success`,
                    layout: 'split',
                    questions: [
                        { q: `Xu hướng tiếp theo sẽ đi về đâu?`, a: `Tích hợp sâu rộng, thông minh hơn và cá nhân hóa trải nghiệm.` },
                        { q: `Bước đi đầu tiên nên là gì?`, a: `Bắt đầu từ những thử nghiệm nhỏ nhưng hành động quyết liệt.` },
                        { q: `Làm sao đo lường sự thành công?`, a: `Dựa trên kết quả thực tế thu được và giá trị tạo ra cho cộng đồng.` }
                    ],
                    notes: `Tóm tắt lại toàn bộ nội dung. Kết thúc bài thuyết trình bằng một thông điệp truyền cảm hứng mạnh mẽ.`
                }
            ];
        }

        // TẠO SLIDE
        function generateSlides() {
            const topic = document.getElementById('topicInput').value.trim() || 'Công Nghệ';
            slideData = createDataFromTopic(topic);
            currentSlide = 0;
            renderSlide();
        }

        // RENDER SLIDE HIỆN TẠI
        function renderSlide() {
            const data = slideData[currentSlide];
            const contentEl = document.getElementById('slideContent');
            const bgOverlay = document.getElementById('bgOverlay');
            
            // Re-trigger animation
            contentEl.classList.remove('animate-slide-up');
            void contentEl.offsetWidth; 
            contentEl.classList.add('animate-slide-up');

            // Set dynamic unsplash images based on query
            const imgUrl = `https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=80`;
            const dynamicImg = `https://source.unsplash.com/800x600/?${encodeURIComponent(data.imageQuery)}`;
            const bgImg = `https://source.unsplash.com/1600x900/?${encodeURIComponent(data.imageQuery)}`;

            // Update Background Overlay
            bgOverlay.style.backgroundImage = `url('${bgImg}'), url('https://picsum.photos/1600/900')`;

            // HTML Structure
            contentEl.innerHTML = `
                <div class="slide-text-side">
                    <h1 class="slide-title">${data.title}</h1>
                    <p class="slide-subtitle">${data.subtitle}</p>
                    
                    <div class="questions-container">
                        ${data.questions.map(q => `
                            <div class="q-card">
                                <div class="q-title"><i class="fa-solid fa-circle-question"></i> ${q.q}</div>
                                <div>${q.a}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                
                <div class="slide-image-side">
                    <img src="${dynamicImg}" 
                         onerror="this.onerror=null; this.src='https://picsum.photos/800/600?random=${currentSlide}';" 
                         alt="Minh họa ${data.title}">
                </div>
            `;

            // Update Page Indicator & Speaker Notes
            document.getElementById('pageIndicator').innerText = `Slide ${currentSlide + 1} / ${slideData.length}`;
            document.getElementById('speakerNotes').innerText = data.notes;
        }

        function nextSlide() {
            if (currentSlide < slideData.length - 1) {
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
            }
        }

        // Tự động khởi chạy lần đầu
        window.onload = generateSlides;
    </script>
</body>
</html>
