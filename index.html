<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo Slide Thuyết Trình AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background-color: #1e293b;
      width: 100%;
      max-width: 650px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    p.subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 14px;
      background-color: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 10px;
      font-size: 1rem;
      resize: vertical;
      outline: none;
      margin-bottom: 20px;
    }
    textarea:focus {
      border-color: #38bdf8;
    }
    .btn {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background-color: #38bdf8;
      color: #0f172a;
      width: 100%;
    }
    .btn-primary:hover {
      background-color: #0284c7;
      color: #ffffff;
    }
    .confirm-group {
      display: none;
      gap: 12px;
      width: 100%;
    }
    .btn-confirm {
      background-color: #22c55e;
      color: #ffffff;
      flex: 1;
    }
    .btn-confirm:hover {
      background-color: #16a34a;
    }
    .btn-cancel {
      background-color: #ef4444;
      color: #ffffff;
      flex: 1;
    }
    .btn-cancel:hover {
      background-color: #dc2626;
    }
    .loading-state {
      display: none;
      margin-top: 20px;
      color: #38bdf8;
      font-size: 1.05rem;
    }
    .questions-container {
      display: none;
      margin-top: 25px;
      text-align: left;
      background-color: #0f172a;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .questions-container h3 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: #38bdf8;
    }
    .question-card {
      background-color: #1e293b;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }
    .question-title {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }
    .mode-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .btn-mode {
      padding: 6px 12px;
      font-size: 0.85rem;
      background-color: #334155;
      color: #f8fafc;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-mode.active {
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: bold;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 10px;
      background-color: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>✨ Tạo Slide Thuyết Trình AI</h1>
    <p class="subtitle">Biến ý tưởng thô thành bài thuyết trình PPTX chuyên nghiệp trong vài giây</p>

    <!-- Ô nhập ý tưởng (Không bị giới hạn ký tự) -->
    <textarea id="userPrompt" placeholder="Nhập ý tưởng bài thuyết trình của bạn tại đây..."></textarea>

    <!-- Khu vực nút bấm -->
    <div id="actionArea">
      <button id="btnSend" class="btn btn-primary" onclick="clickSend()">Gửi</button>

      <div id="confirmGroup" class="confirm-group">
        <button class="btn btn-confirm" onclick="clickConfirm()">Xác nhận</button>
        <button class="btn btn-cancel" onclick="clickCancel()">Hủy</button>
      </div>
    </div>

    <!-- Trạng thái chờ -->
    <div id="loadingState" class="loading-state">
      ⏳ AI đang phân tích ý tưởng và khởi tạo câu hỏi...
    </div>

    <!-- Khung 3 câu hỏi cốt lõi -->
    <div id="questionsContainer" class="questions-container">
      <h3>🎯 Hãy trả lời 3 câu hỏi sau để AI tạo slide đúng ý bạn nhất:</h3>
      <div id="questionsList"></div>
      <button class="btn btn-primary" style="margin-top: 10px;" onclick="alert('Đã ghi nhận! Bước tiếp theo sẽ tiến hành kết nối AI sinh file PPTX.')">Bắt đầu tạo Slide PPTX</button>
    </div>
  </div>

  <script>
    // Bấm nút Gửi
    function clickSend() {
      const prompt = document.getElementById('userPrompt').value.trim();
      if (!prompt) {
        alert('Vui lòng nhập ý tưởng bài thuyết trình trước khi gửi!');
        return;
      }
      document.getElementById('btnSend').style.display = 'none';
      document.getElementById('confirmGroup').style.display = 'flex';
    }

    // Bấm nút Hủy
    function clickCancel() {
      document.getElementById('confirmGroup').style.display = 'none';
      document.getElementById('btnSend').style.display = 'block';
    }

    // Bấm nút Xác nhận
    function clickConfirm() {
      document.getElementById('confirmGroup').style.display = 'none';
      document.getElementById('loadingState').style.display = 'block';

      // Giả lập thời gian AI xử lý 1.5 giây
      setTimeout(() => {
        document.getElementById('loadingState').style.display = 'none';
        renderCoreQuestions();
        document.getElementById('questionsContainer').style.display = 'block';
      }, 1500);
    }

    // Hiển thị 3 câu hỏi cốt lõi
    function renderCoreQuestions() {
      const questions = [
        {
          id: 1,
          title: "1. Khán giả chính lắng nghe bài thuyết trình này là ai?",
          options: ["Học sinh / Sinh viên", "Nhà đầu tư / Ban lãnh đạo", "Khách hàng / Đối tác"]
        },
        {
          id: 2,
          title: "2. Phong cách thiết kế slide bạn mong muốn là gì?",
          options: ["Tối giản & Hiện đại", "Sáng tạo & Tương tác", "Chuyên nghiệp & Nhiều số liệu"]
        },
        {
          id: 3,
          title: "3. Mục tiêu lớn nhất của bài thuyết trình này là gì?",
          options: ["Thuyết phục / Bán hàng", "Truyền cảm hứng / Đào tạo", "Báo cáo tiến độ / Tổng kết"]
        }
      ];

      const listDiv = document.getElementById('questionsList');
      listDiv.innerHTML = '';

      questions.forEach(q => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.innerHTML = `
          <div class="question-title">${q.title}</div>
          <div class="mode-buttons">
            <button id="btn-select-${q.id}" class="btn-mode active" onclick="switchMode(${q.id}, 'select')">Chọn</button>
            <button id="btn-input-${q.id}" class="btn-mode" onclick="switchMode(${q.id}, 'input')">Nhập</button>
          </div>
          <div id="box-select-${q.id}">
            <select>
              ${q.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
            </select>
          </div>
          <div id="box-input-${q.id}" style="display: none;">
            <input type="text" placeholder="Tự nhập câu trả lời của bạn..." />
          </div>
        `;
        listDiv.appendChild(card);
      });
    }

    // Chuyển đổi giữa chế độ Chọn và Nhập
    function switchMode(qId, mode) {
      const selectBox = document.getElementById(`box-select-${qId}`);
      const inputBox = document.getElementById(`box-input-${qId}`);
      const btnSelect = document.getElementById(`btn-select-${qId}`);
      const btnInput = document.getElementById(`btn-input-${qId}`);

      if (mode === 'select') {
        selectBox.style.display = 'block';
        inputBox.style.display = 'none';
        btnSelect.classList.add('active');
        btnInput.classList.remove('active');
      } else {
        selectBox.style.display = 'none';
        inputBox.style.display = 'block';
        btnInput.classList.add('active');
        btnSelect.classList.remove('active');
      }
    }
  </script>
</body>
</html>
