<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PowerPoint Generator</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 35px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        h1 { font-size: 26px; font-weight: 800; text-align: center; margin-bottom: 20px; background: linear-gradient(135deg, #a855f7, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; color: #94a3b8; margin-bottom: 8px; font-weight: 600; }
        
        input[type="text"], textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Step 2 Section */
        #step2 { display: none; margin-top: 25px; border-top: 1px dashed rgba(255,255,255,0.15); padding-top: 20px; }
        .question-item { margin-bottom: 15px; }
        .q-label { font-size: 14px; color: #ec4899; font-weight: 700; margin-bottom: 6px; }

        .loading { display: none; text-align: center; color: #a855f7; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h1><i class="fa-solid fa-wand-magic-sparkles"></i> AI Slide Generator</h1>

        <!-- BƯỚC 1: NHẬP CHỦ ĐỀ -->
        <div id="step1">
            <div class="input-group">
                <label for="topic">1. Nhập chủ đề thuyết trình của bạn:</label>
                <input type="text" id="topic" placeholder="Ví dụ: Chiến lược Marketing 2026, Trí tuệ nhân tạo...">
            </div>
            <button class="btn" id="btnStep1" onclick="fetchQuestions()">
                <i class="fa-solid fa-arrow-right"></i> Tiếp tục & Lấy câu hỏi định hướng
            </button>
        </div>

        <!-- BƯỚC 2: TRẢ LỜI 3 CÂU HỎI VÀ XUẤT FILE -->
        <div id="step2">
            <label style="color: #f59e0b; margin-bottom: 15px;">2. Hãy trả lời 3 câu hỏi dưới đây để AI hiểu rõ ý bạn hơn:</label>
            
            <div id="questionsContainer"></div>

            <button class="btn" id="btnStep2" onclick="generateAndDownloadPPTX()">
                <i class="fa-solid fa-file-powerpoint"></i> Tạo & Tải File PPTX Ngay
            </button>
        </div>

        <div class="loading" id="loadingStatus">
            <i class="fa-solid fa-spinner fa-spin"></i> <span id="loadingText">AI đang phân tích...</span>
        </div>
    </div>

    <script>
        let currentQuestions = [];

        // HÀM BƯỚC 1: GỬI CHỦ ĐỀ ĐỂ AI TẠO 3 CÂU HỎI
        async function fetchQuestions() {
            const topic = document.getElementById('topic').value.trim();
            if (!topic) return alert('Vui lòng nhập chủ đề!');

            const btn1 = document.getElementById('btnStep1');
            const loading = document.getElementById('loadingStatus');
            const loadingText = document.getElementById('loadingText');

            btn1.disabled = true;
            loading.style.display = 'block';
            loadingText.innerText = "AI đang suy nghĩ 3 câu hỏi cốt lõi...";

            try {
                const res = await fetch('/api/generate-slide', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get-questions', topic })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Lỗi lấy câu hỏi');

                currentQuestions = data.questions;

                // Render 3 câu hỏi ra màn hình
                const container = document.getElementById('questionsContainer');
                container.innerHTML = currentQuestions.map((q, index) => `
                    <div class="question-item">
                        <div class="q-label"><i class="fa-solid fa-circle-question"></i> Câu ${index + 1}: ${q}</div>
                        <textarea id="ans_${index}" rows="2" placeholder="Nhập câu trả lời ngắn của bạn... (Hoặc để trống nếu muốn AI tự gợi ý)"></textarea>
                    </div>
                `).join('');

                // Chuyển sang Bước 2
                document.getElementById('step2').style.display = 'block';

            } catch (err) {
                alert('Có lỗi: ' + err.message);
            } finally {
                btn1.disabled = false;
                loading.style.display = 'none';
            }
        }

        // HÀM BƯỚC 2: GỬI CHỦ ĐỀ + 3 CÂU TRẢ LỜI ĐỂ TẠO VÀ TẢI FILE PPTX
        async function generateAndDownloadPPTX() {
            const topic = document.getElementById('topic').value.trim();
            const btn2 = document.getElementById('btnStep2');
            const loading = document.getElementById('loadingStatus');
            const loadingText = document.getElementById('loadingText');

            // Thu thập câu trả lời
            const answers = currentQuestions.map((q, index) => {
                const ans = document.getElementById(`ans_${index}`).value.trim();
                return {
                    question: q,
                    answer: ans || 'Theo gợi ý chuẩn nhất từ AI'
                };
            });

            btn2.disabled = true;
            loading.style.display = 'block';
            loadingText.innerText = "AI đang Soạn Slide & Đóng gói File PPTX...";

            try {
                const res = await fetch('/api/generate-slide', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'generate-pptx', topic, answers })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || 'Lỗi tạo file PPTX');
                }

                // Tự động tải file về trình duyệt
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${topic.replace(/\s+/g, '_')}_Presentation.pptx`;
                document.body.appendChild(a);
                a.click();
                a.remove();

                alert('Tạo bài thuyết trình thành công! File PPTX đã được tải về.');

            } catch (err) {
                alert('Có lỗi: ' + err.message);
            } finally {
                btn2.disabled = false;
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
